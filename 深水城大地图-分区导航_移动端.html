<title>深水城大地图 · 分区导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #16110c; overflow: hidden; }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    cursor: crosshair;
  }
  #frame {
    position: relative;
    transform-origin: center center;
    transition: transform .6s cubic-bezier(.22,.8,.3,1);
  }

    /* 调试模式下的区域框 */
  .ward-box {
    position: absolute;
    border: 2px solid rgba(255, 60, 60, .9);
    background: rgba(255, 60, 60, .12);
    pointer-events: none;
    display: none;
  }
  .ward-box span {
    position: absolute;
    top: 2px; left: 2px;
    font: 11px/1.3 "Songti SC", "STSong", serif;
    color: #fff;
    background: rgba(160, 20, 20, .85);
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  body.debug .ward-box { display: block; }

  /* 仅在动画期间提升为独立图层；常驻 will-change 会让浏览器按缩放前的
     分辨率缓存纹理，导致推近后整张图发糊 */
  #frame.animating { will-change: transform; }
  #map {
    display: block;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;   /* 关掉 iOS 长按图片的「存储图像」菜单 */
  }

  /* 侧边导航：面板 + 折叠箭头，两者并排，箭头始终可见 */
  #nav {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 60;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  #panel {
    position: relative;
    background: rgba(24, 17, 10, .92);
    border: 1px solid rgba(201, 168, 106, .45);
    border-radius: 8px;
    padding: 10px 10px 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  /* 滚动放在内层，免得把挂在面板下沿的凸块裁掉 */
  #panel-scroll {
    max-height: calc(100vh - 70px);
    overflow-y: auto;
  }
  /* 折叠后只留「城 区 导 航」四个字 */
  body.nav-collapsed #panel-body { display: none; }
  body.nav-collapsed #panel { padding-bottom: 18px; }

  /* 底部凸块：只有一个箭头 */
  #panel-tab {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 28px;
    padding: 0;
    background: rgba(24, 17, 10, .96);
    color: #e8d5a8;
    border: 1px solid rgba(201, 168, 106, .45);
    border-top: none;
    border-radius: 0 0 12px 12px;
    font: 13px/1 "Songti SC", "STSong", serif;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  #panel-tab:hover { background: #c9a86a; color: #1a1208; }

  /* 小屏：布局与桌面一致（导航左上、提示在底部），仅让提示换行收窄 */
  @media (max-width: 680px) {
    #hint {
      white-space: normal;
      max-width: 72vw;
      text-align: center;
      line-height: 1.55;
      padding: 6px 12px;
    }
  }
  #panel h3 {
    font: 600 13px/1.5 "Songti SC", "STSong", serif;
    color: #c9a86a;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 8px;
  }
  #panel-body button {
    display: block;
    width: 148px;
    margin: 4px 0;
    padding: 7px 10px;
    background: rgba(60, 44, 26, .55);
    color: #e8d5a8;
    border: 1px solid rgba(201, 168, 106, .35);
    border-radius: 5px;
    font: 13px/1.4 "Songti SC", "STSong", serif;
    letter-spacing: 1px;
    text-align: left;
    cursor: pointer;
    transition: background .15s;
  }
  #panel-body button:hover { background: #c9a86a; color: #1a1208; }
  #panel-body button.current { background: #c9a86a; color: #1a1208; }
  #panel-body button.reset { border-style: dashed; color: #b09a6e; }

  /* 放大后的四边平移键（长按持续平移） */
  .pan {
    position: fixed;
    z-index: 55;
    display: none;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(24, 17, 10, .85);
    color: #e8d5a8;
    border: 1px solid rgba(201, 168, 106, .5);
    font: 20px/1 "Songti SC", "STSong", serif;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .pan:hover, .pan.held { background: #c9a86a; color: #1a1208; }
  body.pannable .pan { display: flex; }
  #pan-up    { top: 16px;    left: 50%; transform: translateX(-50%); }
  #pan-down  { bottom: 16px; left: 50%; transform: translateX(-50%); }
  #pan-left  { left: 16px;   top: 50%;  transform: translateY(-50%); }
  #pan-right { right: 16px;  top: 50%;  transform: translateY(-50%); }
  body.pannable #hint { bottom: 78px; }


  /* 放大浮框 */
  #loupe {
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 8px;
    border: 3px solid #c9a86a;
    box-shadow: 0 10px 34px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.45) inset;
    background-repeat: no-repeat;
    background-color: #241c14;
    pointer-events: none;
    display: none;
    z-index: 100;
  }
  #loupe-label {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    background: rgba(20, 14, 8, .82);
    color: #e8d5a8;
    font: 12px/1.4 "Songti SC", "STSong", serif;
    padding: 3px 10px;
    border-radius: 10px;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  #loupe::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 24px; height: 24px;
    transform: translate(-50%, -50%);
    background:
      linear-gradient(#e8d5a8, #e8d5a8) center/1px 100% no-repeat,
      linear-gradient(#e8d5a8, #e8d5a8) center/100% 1px no-repeat;
    opacity: .5;
  }


  /* 底部状态条 */
  #hint {
    position: fixed;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(20, 14, 8, .78);
    color: #d8c290;
    font: 13px/1.7 "Songti SC", "STSong", serif;
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid rgba(201, 168, 106, .35);
    letter-spacing: 1px;
    pointer-events: none;
    white-space: nowrap;
    max-width: 94vw;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity .6s;
  }
</style>

<body data-page-node-id="lPlwU9KfpBCxre1hXYHLEW">
  <div id="stage" data-page-node-id="HzwtMrKlFKRaI07gWILDsr">
    <div id="frame" data-page-node-id="yQc40uYGIGAbFTCPHdxK5H">
      <img id="map" src="深水城大地图.png" alt="深水城大地图" data-page-node-id="Zp3JfbTY7oliCSbUEocZHh">
    </div>
  </div>

  <div id="nav">
    <div id="panel" data-page-node-id="P40DXrPGO2yFreneXGqgbY">
      <div id="panel-scroll">
        <h3 data-page-node-id="tGaGWmNq5kMmbsVBSpwAYK">城 区 导 航</h3>
        <div id="panel-body">
          <div id="ward-list" data-page-node-id="6yeKJSe4LkMi1HgIHFzsPL"></div>
          <!-- <button id="debug-toggle" title="核对各区分框位置用" data-page-node-id="YIRi2SImmTK2xB1wxpSXvu">▢ 显示区域框</button> -->

      <button id="panel-tab" aria-label="折叠或展开城区导航">▲</button>
    </div>
  </div>

  <div id="loupe" data-page-node-id="QDw1bVuFXijBcRVHjiSPxp"><div id="loupe-label" data-page-node-id="742X8a3DvUg80kvcCRtGfJ">深水城 · 局部放大</div></div>

  <button class="pan" id="pan-up"    aria-label="向上平移">↑</button>
  <button class="pan" id="pan-down"  aria-label="向下平移">↓</button>
  <button class="pan" id="pan-left"  aria-label="向左平移">←</button>
  <button class="pan" id="pan-right" aria-label="向右平移">→</button>

  <div id="hint" data-page-node-id="F5ZsrIOYQaXkHqqwiVVJV4">点击城区名聚焦 · 按住地图看放大，松开即消失</div>

<script>
(function () {
  /* ============================================================
   * 城区定位配置 —— 可直接修改这里的数字微调
   * x / y：区域左上角在整张图中的位置（占全图宽高的比例，0~1）
   * w / h：区域的宽高（同样为比例）
   * ============================================================ */
  var WARDS = [
    { name: '战场区 · Field Ward',        x: 0.45, y: 0.1, w: 0.15, h: 0.098 },
    { name: '滨海区 · Sea Ward',          x: 0.25, y: 0.23, w: 0.15, h: 0.1 },
    { name: '北区 · North Ward',          x: 0.48, y: 0.25, w: 0.15, h: 0.1 },
    { name: '城堡区 · Castle Ward',       x: 0.40, y: 0.42, w: 0.15, h: 0.1 },
    { name: '死者之城 · City of the Dead', x: 0.57, y: 0.43, w: 0.127, h: 0.1 },
    { name: '贸易区 · Trade Ward',        x: 0.53, y: 0.53, w: 0.15, h: 0.1 },
    { name: '码头区 · Dock Ward',         x: 0.45, y: 0.62, w: 0.15, h: 0.1 },
    { name: '南部区 · Southern Ward',     x: 0.58, y: 0.70, w: 0.157, h: 0.1 }
  ];

  var mapImg   = document.getElementById('map');
  var frame    = document.getElementById('frame');
  var stage    = document.getElementById('stage');
  var loupe    = document.getElementById('loupe');
  var label    = document.getElementById('loupe-label');
  var hint     = document.getElementById('hint');
  var panel    = document.getElementById('panel');
  var panelTab = document.getElementById('panel-tab');
  var wardList = document.getElementById('ward-list');

  var ZOOM = 2.5;           // 浮框倍率（相对当前视图）
  var ZOOM_MIN = 1.2, ZOOM_MAX = 8;
  var LOUPE_SIZE = 340;     // 浮框边长（正方形），按视口自适应
  var OFFSET = 40;          // 浮框与指针的间距
  var EDGE = 8;             // 距屏幕边缘的最小留白
  var FOCUS_PAD = 30;       // 聚焦时区域四周留白

  var active = false;
  var lastX = 0, lastY = 0, lastTouch = false;
  var pinchStartDist = 0, pinchStartZoom = ZOOM;
  var currentWard = null;   // 当前聚焦的城区（null = 全图）
  var FIT_W = 0, FIT_H = 0; // 全图贴合视口时的基准尺寸（s = 1）
  var VIEW_S = 1, VIEW_TX = 0, VIEW_TY = 0;  // 当前视图状态
  var BAKED_S = 1;          // 图片此刻被烘焙的真实倍率（动画期间仍是上一个状态）
  var bakeTimer = null;

  /* ---------- 把整图按视口等比缩放到位（全图刚好看得见，不裁不溢） ---------- */
  function fitMap() {
    var natW = mapImg.naturalWidth, natH = mapImg.naturalHeight;
    if (!natW || !natH) return;
    var k = Math.min(window.innerWidth / natW, window.innerHeight / natH);
    FIT_W = Math.round(natW * k);
    FIT_H = Math.round(natH * k);
  }
  fitMap();

  /* ---------- 浮框尺寸自适应 ---------- */
  function resizeLoupe() {
    var vw = window.innerWidth, vh = window.innerHeight;
    LOUPE_SIZE = Math.round(Math.max(180, Math.min(340, Math.min(vw, vh) * 0.62)));
    loupe.style.width  = LOUPE_SIZE + 'px';
    loupe.style.height = LOUPE_SIZE + 'px';
  }
  resizeLoupe();

  /* ---------- 视图聚焦 / 复位 ----------
   * 动画用 transform scale 推近（GPU 快）；动画结束后把缩放「烙进」图片真实宽高，
   * 变换只保留位移 —— 这样浏览器按最终尺寸重新栅格化，不会留下被拉大的模糊纹理。
   */
  function computeView() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = 1, tx = 0, ty = 0;

    if (currentWard && FIT_W && FIT_H) {
      var rw = currentWard.w * FIT_W, rh = currentWard.h * FIT_H;
      s = Math.min((vw - FOCUS_PAD * 2) / rw, (vh - FOCUS_PAD * 2) / rh);
      s = Math.min(s, mapImg.naturalWidth / FIT_W);   // 像素密度不超过原图 1:1
      s = Math.max(s, 1);
      tx = -s * (currentWard.x + currentWard.w / 2 - 0.5) * FIT_W;
      ty = -s * (currentWard.y + currentWard.h / 2 - 0.5) * FIT_H;
    }
    return { s: s, tx: tx, ty: ty };
  }

  // 把当前视图状态落成「真实尺寸 + 纯位移」，得到清晰位图
  function bakeView() {
    if (!FIT_W || !FIT_H) return;
    mapImg.style.width  = Math.round(FIT_W * VIEW_S) + 'px';
    mapImg.style.height = Math.round(FIT_H * VIEW_S) + 'px';
    BAKED_S = VIEW_S;
    frame.style.transition = 'none';
    frame.style.transform  = 'translate(' + VIEW_TX + 'px,' + VIEW_TY + 'px)';
    frame.classList.remove('animating');
    void frame.offsetWidth;              // 强制回流后再恢复过渡
    frame.style.transition = '';
    updatePannable();                    // 图比视口大时才显示四边平移键
  }

  function applyView(animate) {
    var v = computeView();
    VIEW_S = v.s; VIEW_TX = v.tx; VIEW_TY = v.ty;

    if (bakeTimer) { clearTimeout(bakeTimer); bakeTimer = null; }

    if (animate === false) {
      bakeView();
      return;
    }

    // 关键：不要先把图缩回基准尺寸再放大 —— 那样视觉上等于「跳回全图重新推近」，
    // 区与区之间就断了。这里保留图片当前的烘焙尺寸，只让 scale 走
    // 「目标倍率 ÷ 当前倍率」这一段差值，于是动画直接从当前视图连续平移推近过去。
    var r = v.s / BAKED_S;
    frame.classList.add('animating');
    frame.style.transform = 'translate(' + v.tx + 'px,' + v.ty + 'px) scale(' + r + ')';
    bakeTimer = setTimeout(function () { bakeTimer = null; bakeView(); }, 640);
  }

  /* ---------- 平移（放大后可用）：单击与长按都是同一速度，按住多久走多久 ---------- */
  var PAN_SPEED = 0.6;                  // 屏/秒
  var panRAF = null, panDir = null, panLast = 0;

  function panUnit() { return Math.min(window.innerWidth, window.innerHeight); }

  function clampView() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var maxX = Math.max(0, (FIT_W * VIEW_S - vw) / 2);
    var maxY = Math.max(0, (FIT_H * VIEW_S - vh) / 2);
    VIEW_TX = Math.min(maxX, Math.max(-maxX, VIEW_TX));
    VIEW_TY = Math.min(maxY, Math.max(-maxY, VIEW_TY));
  }

  function panBy(dir, dist) {
    VIEW_TX += (dir === 'left' ? dist : dir === 'right' ? -dist : 0);
    VIEW_TY += (dir === 'up'   ? dist : dir === 'down'  ? -dist : 0);
    clampView();
    frame.style.transition = 'none';
    // 动画期间图片还是旧倍率的真实尺寸，得把差值那段 scale 带上，否则会突然掉回原尺寸
    var sc = bakeTimer ? ' scale(' + (VIEW_S / BAKED_S) + ')' : '';
    frame.style.transform  = 'translate(' + VIEW_TX + 'px,' + VIEW_TY + 'px)' + sc;
    if (active) update(lastX, lastY);   // 浮框内容跟着一起变
  }

  function startPan(dir, btn) {
    stopPan();
    panDir = dir;
    if (btn) btn.classList.add('held');
    panLast = 0;                        // 0 = 尚未取到首帧时间戳
    var tick = function (now) {
      if (panDir !== dir) return;
      if (panLast) {
        var dt = Math.min(now - panLast, 100) / 1000;   // 卡顿/切后台时截断，避免瞬移
        panBy(dir, panUnit() * PAN_SPEED * dt);
      }
      panLast = now;
      panRAF = requestAnimationFrame(tick);
    };
    panRAF = requestAnimationFrame(tick);
  }

  function stopPan() {
    if (panRAF) { cancelAnimationFrame(panRAF); panRAF = null; }
    panDir = null;
    var btns = document.querySelectorAll('.pan');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('held');
    frame.style.transition = '';
  }

  function updatePannable() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var can = FIT_W * VIEW_S > vw + 2 || FIT_H * VIEW_S > vh + 2;
    document.body.classList.toggle('pannable', can);
    if (!can) stopPan();
  }

  function focusWard(ward, btn) {
    currentWard = ward;
    applyView(true);
    var all = wardList.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('current');
    if (btn) btn.classList.add('current');
    hint.textContent = '已聚焦：' + ward.name + ' · 四边箭头可平移';
    hint.style.opacity = '1';
    setTimeout(function () { hint.style.opacity = '0'; }, 3500);
    if (window.innerWidth <= 680) collapseNav(true);   // 小屏选完自动收起，别挡地图
  }

  function resetView() {
    currentWard = null;
    applyView(true);
    var all = wardList.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('current');
    hint.textContent = '已复位全图 · 点击城区名可再次聚焦';
    hint.style.opacity = '1';
    setTimeout(function () { hint.style.opacity = '0'; }, 3000);
  }

  /* ---------- 生成城区按钮与调试框 ---------- */
  WARDS.forEach(function (w) {
    var btn = document.createElement('button');
    btn.textContent = w.name;
    btn.addEventListener('click', function () {
      close();
      focusWard(w, btn);
    });
    wardList.appendChild(btn);

    var box = document.createElement('div');
    box.className = 'ward-box';
    box.style.left   = (w.x * 100) + '%';
    box.style.top    = (w.y * 100) + '%';
    box.style.width  = (w.w * 100) + '%';
    box.style.height = (w.h * 100) + '%';
    box.innerHTML = '<span>' + w.name + '</span>';
    frame.appendChild(box);
  });

  /* ---------- 放大浮框 ---------- */
  function update(clientX, clientY, fromTouch) {
    lastX = clientX; lastY = clientY;
    if (fromTouch !== undefined) lastTouch = fromTouch;
    var rect = mapImg.getBoundingClientRect();
    var nx = (clientX - rect.left) / rect.width;
    var ny = (clientY - rect.top) / rect.height;
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;

    // 倍率相对当前视图；像素最多拉到原图 2 倍，避免糊成一团
    var bgW = Math.min(rect.width  * ZOOM, mapImg.naturalWidth  * 2);
    var bgH = Math.min(rect.height * ZOOM, mapImg.naturalHeight * 2);
    var bgX = nx * bgW - LOUPE_SIZE / 2;
    var bgY = ny * bgH - LOUPE_SIZE / 2;

    loupe.style.backgroundImage    = 'url("' + mapImg.src + '")';
    loupe.style.backgroundSize     = bgW + 'px ' + bgH + 'px';
    loupe.style.backgroundPosition = (-bgX) + 'px ' + (-bgY) + 'px';
    label.textContent = '深水城 · 放大 ' + ZOOM.toFixed(1) + '×';

    place(clientX, clientY);
  }

  /* 浮框跟随：选边带粘性 —— 定下哪一侧就一直用，只有那一侧真的放不下才翻面。
     旧写法每帧都按「上方优先」重算，手指滑过临界区时会连续翻好几次。 */
  var sideX = null, sideY = null;      // 1 = 指针右侧/下方，-1 = 左侧/上方

  function pickAxis(clientPos, size, vLen, preferNeg, curSide) {
    var neg = clientPos - OFFSET - size;          // 左侧 / 上方
    var pos = clientPos + OFFSET;                 // 右侧 / 下方
    var negOK = neg >= EDGE;
    var posOK = pos + size <= vLen - EDGE;

    var side = (curSide === 1 || curSide === -1) ? curSide : (preferNeg ? -1 : 1);
    if (side === -1 && !negOK && posOK)      side = 1;
    else if (side === 1 && !posOK && negOK)  side = -1;

    var p = (side === -1) ? neg : pos;
    var max = vLen - EDGE - size;
    if (p > max) p = Math.max(EDGE, max);
    if (p < EDGE) p = EDGE;
    return { p: p, side: side };
  }

  function place(clientX, clientY) {
    var rx = pickAxis(clientX, LOUPE_SIZE, window.innerWidth,  false, sideX);
    var ry = pickAxis(clientY, LOUPE_SIZE, window.innerHeight, lastTouch, sideY); // 手指时优先上方
    sideX = rx.side;
    sideY = ry.side;
    loupe.style.left = rx.p + 'px';
    loupe.style.top  = ry.p + 'px';
  }

  function open(x, y, fromTouch) {
    active = true;
    sideX = sideY = null;        // 每次重新按下按偏好重新选边
    loupe.style.display = 'block';
    hint.style.opacity = '0';
    update(x, y, fromTouch);
  }

  function close() {
    active = false;
    loupe.style.display = 'none';
  }

  /* ---------- 交互 ---------- */
  // 记住这一轮是鼠标还是手指：既决定浮框放在指针上方还是下方，
  // 也用来把触摸产生的 click 挡掉（iOS 补发 click 的延迟不定，用时间戳挡不住）
  var lastPointerType = 'mouse';
  window.addEventListener('pointerdown', function (e) {
    lastPointerType = e.pointerType || 'mouse';
    lastTouch = (e.pointerType === 'touch' || e.pointerType === 'pen');
  }, { passive: true, capture: true });

  /* 移动端主交互：手指按住地图一小会儿出现浮框，松开即消失 */

  // 长按地图时屏蔽系统的「保存图片 / 下载图片」菜单（Android 走 contextmenu，
  // iOS 由上面的 -webkit-touch-callout: none 处理，这里双保险）
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  var HOLD_MS = 120;                 // 长按判定时间，很短，几乎就是「碰到」
  var holdTimer = null, touchLoupe = false, holdPt = null;

  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;          // 双指留给捏合调倍率
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    holdPt = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touchLoupe = false;
    holdTimer = setTimeout(function () {
      holdTimer = null;
      touchLoupe = true;
      lastTouch = true;
      open(holdPt.x, holdPt.y, true);
    }, HOLD_MS);
  }, { passive: true });

  // 只要上一次按下不是鼠标，这次 click 就是触摸补发的，一律无视
  stage.addEventListener('click', function (e) {
    if (lastPointerType !== 'mouse') return;
    if (active) { close(); return; }
    open(e.clientX, e.clientY, false);
  });

  window.addEventListener('mousemove', function (e) {
    if (!active) return;
    update(e.clientX, e.clientY, false);
  });

  // 单指移动：更新浮框内容；双指捏合：调倍率
  window.addEventListener('touchmove', function (e) {
    if (!active) return;

    if (e.touches.length === 2) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (pinchStartDist > 0) {
        ZOOM = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinchStartZoom * dist / pinchStartDist));
      }
      update((e.touches[0].clientX + e.touches[1].clientX) / 2,
             (e.touches[0].clientY + e.touches[1].clientY) / 2, true);
      return;
    }

    if (e.touches.length !== 1) return;
    e.preventDefault();
    update(e.touches[0].clientX, e.touches[0].clientY, true);
  }, { passive: false });

  window.addEventListener('touchstart', function (e) {
    if (!active || e.touches.length !== 2) return;
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.sqrt(dx * dx + dy * dy);
    pinchStartZoom = ZOOM;
  }, { passive: true });

  function endTouch(e) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (e.touches.length < 2) pinchStartDist = 0;
    if (touchLoupe && e.touches.length === 0) {   // 最后一根手指离开 → 浮框消失
      close();
      touchLoupe = false;
    }
  }
  window.addEventListener('touchend', endTouch, { passive: true });
  window.addEventListener('touchcancel', endTouch, { passive: true });

  window.addEventListener('wheel', function (e) {
    if (!active) return;
    e.preventDefault();
    ZOOM = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, ZOOM + (e.deltaY < 0 ? 0.25 : -0.25)));
    update(lastX, lastY);
  }, { passive: false });

  document.getElementById('reset-view').addEventListener('click', resetView);
  // 调试用
  // document.getElementById('debug-toggle').addEventListener('click', function () {
  //   document.body.classList.toggle('debug');
  //   this.textContent = document.body.classList.contains('debug') ? '▣ 隐藏区域框' : '▢ 显示区域框';
  // });
  /* ---------- 导航折叠 ---------- */
  function collapseNav(collapsed) {
    document.body.classList.toggle('nav-collapsed', collapsed);
    panelTab.textContent = collapsed ? '▼' : '▲';   // 只有箭头，不带文字
  }
  panelTab.addEventListener('click', function () {
    collapseNav(!document.body.classList.contains('nav-collapsed'));
  });
  if (window.innerWidth <= 680) collapseNav(true);   // 小屏默认收起

  /* ---------- 四边平移键：长按持续移动 ---------- */
  [['pan-up','up'], ['pan-down','down'], ['pan-left','left'], ['pan-right','right']]
    .forEach(function (pair) {
      var btn = document.getElementById(pair[0]);
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        startPan(pair[1], btn);
      });
      btn.addEventListener('pointerup', stopPan);
      btn.addEventListener('pointerleave', stopPan);
      btn.addEventListener('pointercancel', stopPan);
    });
  window.addEventListener('blur', stopPan);

  // 键盘方向键也能平移（按住可连续）
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { close(); if (currentWard) resetView(); return; }
    var dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
    if (!dir || !document.body.classList.contains('pannable')) return;
    e.preventDefault();
    panBy(dir, panUnit() * 0.04);      // 按住方向键连续触发即为持续平移
  });

  window.addEventListener('resize', function () {
    fitMap(); resizeLoupe(); applyView(false);
    if (active) place(lastX, lastY);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      fitMap(); resizeLoupe(); applyView(false);
      if (active) place(lastX, lastY);
    }, 120);
  });

  // 图片尺寸要等加载完才知道，加载后先摆好全图
  if (mapImg.complete) { fitMap(); applyView(false); }
  else mapImg.addEventListener('load', function () { fitMap(); applyView(false); });
})();
</script>
</body>
</html>
